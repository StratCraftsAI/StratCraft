# Gitleaks configuration
#
# TICKET_1372_3: [extend] is REQUIRED. A config without it replaces the entire
# built-in ruleset, so gitleaks runs with zero rules and every scan reports
# "no leaks found" regardless of content. Because both compliance.yml and
# public-release-gates.yml invoke `gitleaks detect --source .`, gitleaks
# auto-loads this file from the target path and the secret gate silently
# became a no-op. Never remove this block.
[extend]
  useDefault = true

# Allowlisted findings are historical commits that have been reviewed and remediated.
# - oauth-token file: removed from git tracking, added to .gitignore
# - doc example tokens: truncated placeholder values in current HEAD
# - test fake tokens: replaced with non-matching test values in current HEAD
# - credential-handlers sessionToken: replaced with safe value in current HEAD
# - deleted files (core-engine test, TICKET_055): no longer exist in HEAD

[allowlist]
  description = "Historical findings reviewed and remediated"

  # TICKET_1372_3: reviewed non-secrets that the generic-api-key rule matches on
  # the generated public tree. Matched by content, not line number, so an edit
  # above them does not silently re-open the finding.
  # Matched against the detected secret value itself, not the surrounding line.
  regexes = [
    # Literal marker returned by the V3 OS-keychain path; not a credential.
    # apps/desktop/src/main/ipc/credential-handlers.ts
    '''^v3-os-keychain$''',
    # OpenAPI schema property name (P25 percentile compute-hours metric); not a credential.
    # packages/types/contracts/governance-api-v1.openapi.json
    '''^p25_compute_hours$''',
  ]

  # 16-hex content digests identifying audit entries, not credentials.
  paths = [
    '''docs/architecture/modern-cpp-audit/approved-boundaries\.json$''',
  ]

