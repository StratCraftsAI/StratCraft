[project]
name = "research-contracts"
version = "1.0.0"
description = "Public StratCraft research boundary contracts and bounded data adapters"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["research_contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
